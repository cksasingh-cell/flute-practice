<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sur Practice — Flute Practice App</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Left decorative section -->
        <aside class="left-section">
            <div class="breath-indicator"></div>
        </aside>

        <!-- Center playback section -->
        <main class="center-section">
            <div class="player-wrapper">
                <h1 class="app-title">Sur Practice</h1>
                
                <div class="playback-controls">
                    <button id="playPauseBtn" class="play-button" aria-label="Play/Pause">
                        <svg class="icon icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <svg class="icon icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="6" y="4" width="4" height="16"></rect>
                            <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                    </button>

                    <button id="skipBtn" class="skip-button" aria-label="Skip to next">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 4 15 12 5 20 5 4"></polygon>
                            <line x1="19" y1="5" x2="19" y2="19"></line>
                        </svg>
                    </button>
                </div>

                <div class="now-playing">
                    <div class="label">Now Playing</div>
                    <div id="currentFileName" class="file-name">Select files to begin</div>
                </div>

                <div class="progress-container">
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                </div>

                <div id="statusMessage" class="status-message"></div>
            </div>
        </main>

        <!-- Right file management section -->
        <aside class="right-section">
            <div class="file-panel">
                <div class="panel-header">
                    <h2>Sur Files</h2>
                    <button id="authBtn" class="auth-button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                        <span>Connect Google Drive</span>
                    </button>
                </div>

                <div class="file-actions">
                    <button id="uploadBtn" class="action-button" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        Upload Files
                    </button>
                    <input type="file" id="fileInput" accept="audio/mp3,audio/wav,audio/m4a,audio/mpeg,audio/x-m4a" multiple hidden>
                    
                    <div class="selection-controls">
                        <button id="selectAllBtn" class="text-button" disabled>Select All</button>
                        <span class="separator">•</span>
                        <button id="deselectAllBtn" class="text-button" disabled>Deselect All</button>
                    </div>
                </div>

                <div id="fileList" class="file-list">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                        </svg>
                        <p>Connect Google Drive to get started</p>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Hidden audio element -->
    <audio id="audioPlayer" preload="auto"></audio>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p id="loadingText">Loading...</p>
    </div>

    <!-- App Configuration -->
    <script src="config.js"></script>
    
    <!-- Google API and Google Identity Services -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    
    <!-- Application Scripts -->
    <script src="js/gdrive.js"></script>
    <script src="js/audio-player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
